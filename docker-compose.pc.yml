version: '3.8'

services:
  ros2_pc_dev:
    image: smart_robot:pc
    build:
      context: .
      dockerfile: Dockerfile.pc
    container_name: jazzy_pc_container
    network_mode: host # ROS 2 노드 간 멀티캐스트 통신을 위해 호스트 네트워크 직결
    ipc: host
    privileged: true # 가상 센서 및 GUI 자원 제어를 위한 관리자 권한
    environment:
      - DISPLAY=${DISPLAY} # 호스트 PC 화면에 가제보/RViz2 창을 띄우기 위한 핵심 설정
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw # GUI 통신용 소켓 공유
      - .:/ros2_ws/src/smart_road_robot # 현재 폴더의 소스코드를 도커 내부 공간과 실시간 동기화
    stdin_open: true
    tty: true

    # --------------------------------------------------------------------------
    # [NVIDIA 외장 그래픽카드를 쓰는 팀원 전용 설정]
    # 본인 PC가 엔비디아 글카를 쓴다면 아래 5줄의 주석(#)을 해제하고 사용하세요.
    # 단, 호스트 PC에 'nvidia-container-toolkit'이 먼저 설치되어 있어야 합니다.
    # --------------------------------------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
